function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),3000)}
if(CONTACT.email){$('mail').href='mailto:'+CONTACT.email;$('mail').setAttribute('aria-label','메일 보내기');$('email-row').hidden=false;$('email-value').textContent=CONTACT.email;$('email-value').href='mailto:'+CONTACT.email}
$('mail').addEventListener('click',event=>{if(!CONTACT.email){event.preventDefault();toast('이메일 주소가 아직 등록되지 않았습니다')}});
$('back').onclick=()=>{if(history.length>1){history.back()}else{toast('현재 명함의 첫 화면입니다')}};
function escapeVcard(value){return value.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}
function makeVcard(){return ['BEGIN:VCARD','VERSION:3.0','N;CHARSET=UTF-8:최;설희;;;','FN;CHARSET=UTF-8:'+escapeVcard(CONTACT.name),'ORG;CHARSET=UTF-8:'+escapeVcard(CONTACT.organization),'TITLE;CHARSET=UTF-8:'+escapeVcard(CONTACT.title),'TEL;TYPE=CELL:'+CONTACT.phone,'TEL;TYPE=FAX:'+CONTACT.fax,...(CONTACT.email?['EMAIL;TYPE=INTERNET:'+escapeVcard(CONTACT.email)]:[]),'END:VCARD',''].join('\r\n')}
$('save').onclick=()=>{try{const blob=new Blob([makeVcard()],{type:'text/vcard;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='최설희_연락처.vcf';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('연락처가 저장되었습니다')}catch{toast('연락처를 다운로드하지 못했습니다. 다시 시도해 주세요')}};
async function copyText(text){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);return}catch{}}const box=document.createElement('textarea');box.value=text;box.style.cssText='position:fixed;opacity:0';document.body.append(box);box.select();const ok=document.execCommand('copy');box.remove();if(!ok)throw new Error('copy')}
$('share').onclick=async()=>{const url=SHARE_URL||location.href;if(!/^https?:/.test(url)){toast('온라인에 게시한 뒤 주소를 공유할 수 있습니다. 현재는 HTML 파일을 전달해 주세요.');return}if(navigator.share){try{await navigator.share({title:'최설희 · KB손해보험 프로TA코치',text:'고객의 내일을 설계하고, 동료의 성장을 함께 만들어갑니다.',url});return}catch(error){if(error.name==='AbortError')return}}try{await copyText(url);toast('명함 주소가 복사되었습니다')}catch{toast('주소 복사를 지원하지 않습니다. 브라우저 주소창에서 복사해 주세요')}};
</script></body></html>
